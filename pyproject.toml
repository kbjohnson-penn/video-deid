[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["video_deid", "video_deid.blur", "video_deid.deid", "video_deid.keypoints", "video_deid.utils", "video_deid.databricks"]

[project]
name = "video_deid"
version = "1.0.0"
description = "A tool for de-identifying faces in videos while preserving body movements"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Author", email = "sriharshamvs@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Multimedia :: Video",
  "Topic :: Security",
]
keywords = [
  "video",
  "face",
  "de-identification",
  "privacy",
  "anonymization",
  "blur",
  "yolo",
  "databricks",
]
dependencies = [
  "numpy>=1.26.0,<2.0.0",  # Compatible with Databricks libraries
  "pandas>=1.5.0,<2.0.0",  # Compatible with Databricks and numpy<2
  "opencv-python>=4.8.0",
  "tqdm>=4.66.0",
  "ultralytics>=8.0.0",
  "pyspark>=3.4.0",
]

[project.urls]
"Homepage" = "https://github.com/kbjohnson-penn/video-deid"
"Bug Tracker" = "https://github.com/kbjohnson-penn/video-deid/issues"
"Documentation" = "https://github.com/kbjohnson-penn/video-deid"
"Source Code" = "https://github.com/kbjohnson-penn/video-deid"

[project.scripts]
video-deid = "video_deid.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "flake8>=6.0.0",
  "black>=23.0.0",
  "isort>=5.0.0",
  "mypy>=1.0.0",
  "mkdocs>=1.4.0",
  "mkdocs-material>=9.0.0",
]
databricks = [
  "numpy>=1.26.0,<2.0.0",  # Compatible with TensorFlow in Databricks
  "pandas>=1.5.0,<2.0.0",   # Compatible with Databricks
]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=src/video_deid"

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
